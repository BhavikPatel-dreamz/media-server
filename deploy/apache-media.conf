# Apache is already installed. Enable the proxy modules once:
#   sudo a2enmod proxy proxy_http headers
#   sudo systemctl reload apache2
#
# Copy this file, set ServerName, then enable the site:
#   sudo cp deploy/apache-media.conf /etc/apache2/sites-available/media.conf
#   sudo a2ensite media
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# The Node process listens on 127.0.0.1:4100. Set PUBLIC_URL in .env to
# https://media.dynamicdreamz.net when that hostname is the public address.

<VirtualHost *:80>
    ServerName media.dynamicdreamz.net

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 600
    RequestHeader set X-Forwarded-Proto "http"

    # Match MAX_UPLOAD_BYTES in .env (200 MB). Use 0 for no Apache limit.
    LimitRequestBody 209715200

    # Debian's proxy module denies proxying until a vhost grants it.
    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://127.0.0.1:4100/ retry=0 timeout=600
    ProxyPassReverse / http://127.0.0.1:4100/
</VirtualHost>
