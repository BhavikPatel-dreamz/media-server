<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Media Server</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231c1915'/%3E%3Cpath d='M8 22V10h4.2l3.8 7.2L19.8 10H24v12h-2.6v-7.4L18 20h-2l-3.4-5.4V22H8z' fill='%23f4f1ea'/%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #f3efe6;
        --ink: #1c1915;
        --muted: #6f675e;
        --line: #ddd4c6;
        --card: #fffdf8;
        --accent: #9a3412;
        --accent-ink: #fff7ed;
        --danger: #9f1239;
        --shadow: 0 16px 40px rgba(48, 36, 20, 0.08);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(154, 52, 18, 0.08), transparent 28rem),
          var(--bg);
        font: 16px/1.5 "Avenir Next", "Segoe UI", sans-serif;
      }
      button, input { font: inherit; color: inherit; }
      button { cursor: pointer; }
      h1, h2, p { margin: 0; }
      .wrap { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
      header { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 24px; }
      h1 { font-family: Georgia, "Iowan Old Style", serif; font-size: 2.4rem; font-weight: 500; letter-spacing: -0.04em; }
      .lede { color: var(--muted); max-width: 42rem; }
      .keybox { display: flex; gap: 8px; align-items: end; }
      label { display: grid; gap: 6px; font-size: 0.82rem; color: var(--muted); }
      input[type="text"], input[type="password"], input[type="search"] {
        width: 100%;
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 10px;
        padding: 10px 12px;
      }
      input:focus { outline: 2px solid rgba(154, 52, 18, 0.35); border-color: var(--accent); }
      .panel, .card, .drawer {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow);
      }
      .panel { padding: 18px; margin-bottom: 18px; }
      .drop {
        border: 1.5px dashed #c8bba8;
        border-radius: 14px;
        padding: 22px;
        text-align: center;
        background: #faf7f1;
        margin-bottom: 14px;
      }
      .drop.hot { border-color: var(--accent); background: #fff1e8; }
      .row { display: grid; grid-template-columns: 1.1fr 1.4fr 1.4fr auto; gap: 10px; align-items: end; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      button.primary, button.ghost, button.danger {
        border-radius: 999px;
        padding: 10px 16px;
        border: 1px solid transparent;
      }
      button.primary { background: var(--accent); color: var(--accent-ink); }
      button.ghost { background: transparent; border-color: var(--line); }
      button.danger { background: transparent; color: var(--danger); border-color: #fecdd3; }
      button:disabled { opacity: 0.55; cursor: wait; }
      .toolbar { display: flex; justify-content: space-between; gap: 12px; align-items: end; margin-bottom: 14px; }
      .toolbar .filters { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; width: min(520px, 100%); }
      .layout > * { min-width: 0; }
      .count { color: var(--muted); font-size: 0.92rem; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
      .card { overflow: hidden; display: flex; flex-direction: column; }
      .preview { height: 150px; background: #efe8dc; display: grid; place-items: center; overflow: hidden; }
      .preview img, .preview video { width: 100%; height: 100%; object-fit: cover; }
      .kind { font-family: Georgia, serif; font-size: 1.4rem; color: var(--muted); }
      .meta { padding: 12px 14px 14px; display: grid; gap: 8px; }
      .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sub { color: var(--muted); font-size: 0.82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .empty { padding: 28px; text-align: center; color: var(--muted); }
      .status { min-height: 1.4em; margin-top: 10px; color: var(--accent); }
      .layout { display: grid; grid-template-columns: 1fr 320px; gap: 16px; align-items: start; }
      .drawer { padding: 16px; position: sticky; top: 16px; display: grid; gap: 12px; }
      .drawer img, .drawer video, .drawer audio { width: 100%; border-radius: 12px; background: #efe8dc; }
      .url { word-break: break-all; font-size: 0.82rem; color: var(--muted); }
      @media (max-width: 860px) {
        header, .row, .layout, .toolbar { display: grid; grid-template-columns: 1fr; }
        .keybox, .toolbar .filters { width: 100%; }
        .toolbar .filters { grid-template-columns: 1fr; }
        h1 { font-size: 2rem; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header>
        <div>
          <h1>Media Server</h1>
          <p class="lede">Upload, edit, and delete files. Payload CMS can store uploads here through the custom storage adapter.</p>
        </div>
        <div class="keybox">
          <label>API key
            <input id="api-key" type="password" autocomplete="off" placeholder="Paste API_KEY" />
          </label>
          <button class="ghost" id="save-key" type="button">Save</button>
        </div>
      </header>

      <section class="panel">
        <form id="upload-form">
          <div class="drop" id="drop">
            <strong>Drop files here</strong>
            <p class="sub">or choose files to add them to the library</p>
            <input id="file-input" type="file" multiple />
          </div>
          <div class="row">
            <label>Prefix
              <input id="prefix" type="text" placeholder="uploads" />
            </label>
            <label>Title
              <input id="title" type="text" placeholder="Optional title" />
            </label>
            <label>Alt text
              <input id="alt" type="text" placeholder="Optional description" />
            </label>
            <button class="primary" id="upload-button" type="submit">Upload</button>
          </div>
        </form>
        <p class="status" id="status" role="status"></p>
      </section>

      <div class="layout">
        <section>
          <div class="toolbar">
            <div class="filters">
              <label>Search
                <input id="search" type="search" placeholder="Name, title, or alt" />
              </label>
              <label>Filter prefix
                <input id="filter-prefix" type="text" placeholder="uploads" />
              </label>
            </div>
            <p class="count" id="count">No files yet</p>
          </div>
          <div class="grid" id="grid"></div>
          <div id="pager"></div>
        </section>
        <aside class="drawer" id="drawer">
          <h2>Details</h2>
          <p class="sub">Select a file to edit its title, alt text, name, or prefix.</p>
        </aside>
      </div>
    </main>
    <script>
      const state = { docs: [], total: 0, offset: 0, limit: 24, selected: null, publicRead: true, previews: [] }
      const $ = (id) => document.getElementById(id)
      const keyInput = $('api-key')
      keyInput.value = localStorage.getItem('media-server-api-key') || ''

      function setStatus(message) { $('status').textContent = message || '' }
      function authHeaders(extra = {}) {
        const key = keyInput.value.trim()
        if (!key) throw new Error('Save an API key first')
        return { Authorization: `Bearer ${key}`, ...extra }
      }
      async function parseError(response) {
        const body = await response.json().catch(() => ({}))
        throw new Error(body.error || `Request failed (${response.status})`)
      }

      $('save-key').addEventListener('click', () => {
        localStorage.setItem('media-server-api-key', keyInput.value.trim())
        setStatus('API key saved in this browser')
        load()
      })

      async function loadHealth() {
        const response = await fetch('/health')
        const body = await response.json()
        state.publicRead = Boolean(body.publicRead)
      }

      function revokePreviews() {
        for (const url of state.previews) URL.revokeObjectURL(url)
        state.previews = []
      }

      async function mediaSource(item, bucket) {
        if (state.publicRead) return item.url
        const response = await fetch(item.url, { headers: authHeaders() })
        if (!response.ok) return ''
        const url = URL.createObjectURL(await response.blob())
        bucket.push(url)
        return url
      }

      function formatSize(bytes) {
        if (bytes < 1024) return `${bytes} B`
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`
        return `${(bytes / (1024 * 1024)).toFixed(1)} MB`
      }

      function discardPreviews(urls) {
        for (const url of urls) URL.revokeObjectURL(url)
      }

      async function render(id) {
        const docs = state.docs.slice()
        const bucket = []
        const cards = []
        for (const item of docs) {
          if (id !== requestId) {
            discardPreviews(bucket)
            return
          }
          const card = document.createElement('article')
          card.className = 'card'
          const preview = document.createElement('div')
          preview.className = 'preview'
          const source = await mediaSource(item, bucket)
          if (source && item.mimeType.startsWith('image/')) {
            const img = document.createElement('img')
            img.alt = item.alt || item.filename
            img.src = source
            preview.append(img)
          } else if (source && item.mimeType.startsWith('video/') && state.publicRead) {
            const video = document.createElement('video')
            video.src = source
            video.muted = true
            preview.append(video)
          } else {
            const kind = document.createElement('div')
            kind.className = 'kind'
            kind.textContent = item.mimeType.split('/')[1] || 'file'
            preview.append(kind)
          }
          const meta = document.createElement('div')
          meta.className = 'meta'
          const name = document.createElement('div')
          name.className = 'name'
          name.textContent = item.title || item.filename
          const sub = document.createElement('div')
          sub.className = 'sub'
          sub.textContent = `${item.key} · ${formatSize(item.filesize)}`
          const actions = document.createElement('div')
          actions.className = 'actions'
          const edit = document.createElement('button')
          edit.className = 'ghost'
          edit.type = 'button'
          edit.textContent = 'Edit'
          edit.addEventListener('click', () => select(item.id))
          const remove = document.createElement('button')
          remove.className = 'danger'
          remove.type = 'button'
          remove.textContent = 'Delete'
          remove.addEventListener('click', () => removeFile(item))
          actions.append(edit, remove)
          meta.append(name, sub, actions)
          card.append(preview, meta)
          cards.push(card)
        }
        if (id !== requestId) {
          discardPreviews(bucket)
          return
        }
        revokePreviews()
        state.previews = bucket
        const grid = $('grid')
        $('count').textContent = state.total === 1 ? '1 file' : `${state.total} files`
        if (!cards.length) {
          const empty = document.createElement('div')
          empty.className = 'empty panel'
          empty.textContent = 'No files yet. Drop one above to add it.'
          grid.replaceChildren(empty)
        } else {
          grid.replaceChildren(...cards)
        }
        const pager = $('pager')
        pager.replaceChildren()
        if (state.offset + docs.length < state.total) {
          const more = document.createElement('button')
          more.className = 'ghost'
          more.type = 'button'
          more.textContent = 'Load more'
          more.style.marginTop = '14px'
          more.addEventListener('click', () => load(state.offset + state.limit, true))
          pager.append(more)
        }
      }

      async function load(offset = 0, append = false) {
        const id = ++requestId
        try {
          const params = new URLSearchParams({
            q: $('search').value.trim(),
            prefix: $('filter-prefix').value.trim(),
            limit: String(state.limit),
            offset: String(offset),
          })
          const response = await fetch(`/api/files?${params}`, { headers: authHeaders() })
          if (!response.ok) await parseError(response)
          const body = await response.json()
          if (id !== requestId) return
          state.docs = append ? state.docs.concat(body.docs) : body.docs
          state.total = body.total
          state.offset = offset
          if (state.selected && !state.docs.some((item) => item.id === state.selected.id)) {
            const fresh = await fetch(`/api/files/${state.selected.id}`, { headers: authHeaders() })
            if (id !== requestId) return
            state.selected = fresh.ok ? await fresh.json() : null
          }
          await render(id)
          if (id !== requestId) return
          renderDrawer()
        } catch (error) {
          setStatus(error.message)
        }
      }

      function field(label, id, value) {
        const wrap = document.createElement('label')
        wrap.textContent = label
        const input = document.createElement('input')
        input.type = 'text'
        input.id = id
        input.value = value || ''
        wrap.append(input)
        return wrap
      }

      function renderDrawer() {
        const drawer = $('drawer')
        drawer.replaceChildren()
        const title = document.createElement('h2')
        title.textContent = 'Details'
        drawer.append(title)
        const item = state.selected
        if (!item) {
          const note = document.createElement('p')
          note.className = 'sub'
          note.textContent = 'Select a file to edit its title, alt text, name, or prefix.'
          drawer.append(note)
          return
        }
        if (state.publicRead && item.mimeType.startsWith('image/')) {
          const img = document.createElement('img')
          img.alt = item.alt || item.filename
          img.src = item.url
          drawer.append(img)
        }
        const url = document.createElement('p')
        url.className = 'url'
        url.textContent = item.url
        const copy = document.createElement('button')
        copy.className = 'ghost'
        copy.type = 'button'
        copy.textContent = 'Copy URL'
        copy.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(item.url)
            setStatus('URL copied')
          } catch {
            setStatus(item.url)
          }
        })
        drawer.append(url, copy, field('Title', 'edit-title', item.title), field('Alt text', 'edit-alt', item.alt), field('Filename', 'edit-filename', item.filename), field('Prefix', 'edit-prefix', item.prefix))
        const replace = document.createElement('label')
        replace.textContent = 'Replace file'
        const file = document.createElement('input')
        file.type = 'file'
        file.id = 'replace-file'
        replace.append(file)
        const save = document.createElement('button')
        save.className = 'primary'
        save.type = 'button'
        save.textContent = 'Save changes'
        save.addEventListener('click', () => saveItem(item.id))
        const remove = document.createElement('button')
        remove.className = 'danger'
        remove.type = 'button'
        remove.textContent = 'Delete file'
        remove.addEventListener('click', () => removeFile(item))
        drawer.append(replace, save, remove)
      }

      async function select(id) {
        try {
          const response = await fetch(`/api/files/${id}`, { headers: authHeaders() })
          if (!response.ok) await parseError(response)
          state.selected = await response.json()
          renderDrawer()
        } catch (error) {
          setStatus(error.message)
        }
      }

      async function saveItem(id) {
        try {
          const replacement = $('replace-file').files[0]
          if (replacement) {
            const response = await fetch(`/api/files/${id}`, {
              method: 'PUT',
              headers: authHeaders({ 'Content-Type': replacement.type || 'application/octet-stream' }),
              body: replacement,
            })
            if (!response.ok) await parseError(response)
          }
          const response = await fetch(`/api/files/${id}`, {
            method: 'PATCH',
            headers: authHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({
              title: $('edit-title').value,
              alt: $('edit-alt').value,
              filename: $('edit-filename').value,
              prefix: $('edit-prefix').value,
            }),
          })
          if (!response.ok) await parseError(response)
          state.selected = await response.json()
          setStatus('Saved')
          await load(0)
        } catch (error) {
          setStatus(error.message)
        }
      }

      async function removeFile(item) {
        if (!confirm(`Delete ${item.filename}?`)) return
        try {
          const response = await fetch(`/api/files/${item.id}`, { method: 'DELETE', headers: authHeaders() })
          if (!response.ok && response.status !== 204) await parseError(response)
          if (state.selected?.id === item.id) state.selected = null
          setStatus('Deleted')
          await load(0)
        } catch (error) {
          setStatus(error.message)
        }
      }

      async function upload(files) {
        const button = $('upload-button')
        button.disabled = true
        try {
          for (const file of files) {
            setStatus(`Uploading ${file.name}`)
            const params = new URLSearchParams({
              filename: file.name,
              prefix: $('prefix').value.trim(),
              title: $('title').value,
              alt: $('alt').value,
            })
            const response = await fetch(`/api/files?${params}`, {
              method: 'POST',
              headers: authHeaders({ 'Content-Type': file.type || 'application/octet-stream' }),
              body: file,
            })
            if (!response.ok) await parseError(response)
          }
          $('upload-form').reset()
          keyInput.value = localStorage.getItem('media-server-api-key') || keyInput.value
          setStatus('Upload complete')
          await load(0)
        } catch (error) {
          setStatus(error.message)
        } finally {
          button.disabled = false
        }
      }

      $('upload-form').addEventListener('submit', (event) => {
        event.preventDefault()
        const files = $('file-input').files
        if (!files.length) { setStatus('Choose a file first'); return }
        upload(files)
      })

      const drop = $('drop')
      ;['dragenter', 'dragover'].forEach((name) => drop.addEventListener(name, (event) => {
        event.preventDefault()
        drop.classList.add('hot')
      }))
      ;['dragleave', 'drop'].forEach((name) => drop.addEventListener(name, (event) => {
        event.preventDefault()
        drop.classList.remove('hot')
      }))
      drop.addEventListener('drop', (event) => {
        if (event.dataTransfer.files.length) upload(event.dataTransfer.files)
      })

      let requestId = 0
      let timer
      function schedule() {
        clearTimeout(timer)
        timer = setTimeout(() => load(0), 200)
      }
      $('search').addEventListener('input', schedule)
      $('filter-prefix').addEventListener('input', schedule)

      loadHealth().then(() => { if (keyInput.value.trim()) load(0) })
    </script>
  </body>
</html>
